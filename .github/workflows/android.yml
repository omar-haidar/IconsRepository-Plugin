name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assemblePlugin

    - name: Prepare Plugin
      if: github.event_name == 'push'
      run: cp build/plugin/IconsRepository.cgp IconsRepository.cgp

    - name: Publish to the single "latest" release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest --cleanup-tag --yes || true
        gh release create latest IconsRepository.cgp \
          --title "Latest build" \
          --notes "Automated signed release build from commit ${GITHUB_SHA::7}" \
          --target "$GITHUB_SHA" \
          --latest