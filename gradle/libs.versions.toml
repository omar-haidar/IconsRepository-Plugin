[versions]
agp = "9.3.1"
androidsvg = "1.4"
appcompat = "1.7.1"
fragment = "1.8.8"
gson = "2.10.1"
guava = "31.1-android"
kotlin = "2.3.0"
material = "1.14.0"
recyclerview = "1.4.0"
svgGenerator = "1.3.2"

[libraries]
androidsvg = { module = "com.caverock:androidsvg", version.ref = "androidsvg" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
google-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
material = { module = "com.google.android.material:material", version.ref = "material" }
svg-generator = { module = "com.github.megatronking:svg-generator", version.ref = "svgGenerator" }
svg-support = { module = "com.github.megatronking:svg-support", version.ref = "svgGenerator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
